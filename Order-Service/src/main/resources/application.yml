server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ORDER-SERVICE

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/orderdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

feign:
  circuitbreaker:
    enabled: true

  client:
    config:
      default:
        connectTimeout: 30000
        readTimeout: 30000
        loggerLevel: full

resilience4j:
  timelimiter:
    instances:
      PRODUCT-SERVICE:
        timeoutDuration: 30s
        cancelRunningFuture: true

      PAYMENT-SERVICE:
        timeoutDuration: 30s
        cancelRunningFuture: true

  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5000ms
        failureRateThreshold: 50

        ignoreExceptions:
          - feign.FeignException$NotFound
          - com.example.Order.Service.exception.ProductNotFoundException
          - com.example.Order.Service.exception.OutOfStockException
          - com.example.Order.Service.exception.InvalidQuantityException

    instances:
      PRODUCT-SERVICE:
        baseConfig: default

      PAYMENT-SERVICE:
        baseConfig: default

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5

logging:
  level:
    com.example.Order.Service: ${LOG_LEVEL:INFO}
jwt:
  secret: ${JWT_SECRET:s8Kx92!LmPq#2026@ShopZoneJWTSecret}
