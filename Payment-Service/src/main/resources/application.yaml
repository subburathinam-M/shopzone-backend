server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: PAYMENT-SERVICE

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/paymentdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/shopzone-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8090/realms/shopzone-realm/protocol/openid-connect/certs}

  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: true

    consumer:
      group-id: payment-service

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"

        spring.json.use.type.headers: false

        spring.json.type.mapping:
          orderPlacedEvent: com.example.Payment_Service.event.OrderPlacedEvent

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

    fetch-registry: true
    register-with-eureka: true

stripe:
  api-key: ${STRIPE_SECRET_KEY:}

  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

logging:
  level:
    com.example.payment: ${LOG_LEVEL:INFO}